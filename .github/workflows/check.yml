name: DropMP4 checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dropmp4-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iphone-free:
    name: Free iPhone test package (9 tests)
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Build standalone iPhone package and run nine Simulator tests
        run: bash scripts/ci-iphone-free.sh
      - name: Upload tested unsigned IPA for Windows local signing
        uses: actions/upload-artifact@v4
        with:
          name: DropMP4-Free-unsigned
          path: |
            build/iphone-free/DropMP4-Free-unsigned.ipa
            build/iphone-free/DropMP4-Free-unsigned.ipa.sha256
            docs/IPHONE_WINDOWS_FREE.md
          if-no-files-found: error
          retention-days: 7
      - name: Collect free variant diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-free-diagnostics-${{ github.run_number }}
          path: |
            build/iphone-free/*.log
            build/iphone-free/*.txt
            build/iphone-free/*.json
            build/iphone-free/*.xcresult
          if-no-files-found: warn
          retention-days: 3
      - name: Explain installation requirement
        if: always()
        run: |
          echo '### Free iPhone test variant' >> "$GITHUB_STEP_SUMMARY"
          echo 'Standalone local Files import; no App Groups or Photos share extension. Original full variant is retained.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The IPA is UNSIGNED. A Windows sideloading tool must sign it locally with your own free Apple account before installation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Apple credentials, developer certificates, payments or TestFlight in this workflow.' >> "$GITHUB_STEP_SUMMARY"
  receiver:
    # Public standard runners are free. Do not incur private-repo usage if visibility changes.
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_receiver.py -v
  ios-build:
    name: iOS build and Simulator tests
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Build app and execute iOS Simulator tests
        run: bash scripts/ci-ios.sh
      - name: Collect build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics-${{ github.run_number }}
          path: |
            build/ios-ci/*.log
            build/ios-ci/*.txt
            build/ios-ci/*.json
            build/ios-ci/*.xcresult
            ios/DropMP4.xcodeproj/project.pbxproj
          if-no-files-found: warn
          retention-days: 3
      - name: Explain build scope
        if: always()
        run: |
          echo '### DropMP4 iOS build and tests' >> "$GITHUB_STEP_SUMMARY"
          echo 'Builds the app and share extension for Simulator and iPhone, and executes four XCTest cases on iOS 18.5 Simulator.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Simulator uses local ad-hoc signing; iPhone build remains unsigned. No Apple account, payment, TestFlight or device installation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Success requires 4 passed, 0 failed and 0 skipped in the actual xcresult summary. Inspect the test step and diagnostics artifact for results.' >> "$GITHUB_STEP_SUMMARY"
