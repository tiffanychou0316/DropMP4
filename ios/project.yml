name: DropMP4
options:
  bundleIdPrefix: org.dropmp4
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    GROUP_ID: group.org.dropmp4.app
    CODE_SIGN_STYLE: Automatic
targets:
  DropMP4Free:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.dropmp4.freetest
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DROPMP4_FREE_TEST
        ENABLE_APP_GROUPS: NO
    info:
      path: Generated/Free-Info.plist
      properties:
        CFBundleDisplayName: DropMP4 Test
        CFBundleShortVersionString: '0.1.1'
        CFBundleVersion: '2'
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: 尋找同一個 Wi-Fi 上的 DropMP4 電腦，直接傳送影片。
        NSBonjourServices: [_dropmp4._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  DropMP4FreeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, FreeTests]
    dependencies:
      - target: DropMP4Free
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.dropmp4.freetest.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DROPMP4_FREE_TEST
  DropMP4:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.dropmp4.app
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: DropMP4
        UILaunchScreen: {}
        SharedGroup: $(GROUP_ID)
        NSLocalNetworkUsageDescription: 尋找同一個 Wi-Fi 上的 DropMP4 電腦，直接傳送影片。
        NSBonjourServices: [_dropmp4._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Generated/App.entitlements
      properties:
        com.apple.security.application-groups: [$(GROUP_ID)]
    dependencies:
      - target: DropMP4Share
  DropMP4Tests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: DropMP4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.dropmp4.tests
        GENERATE_INFOPLIST_FILE: YES
  DropMP4Share:
    type: app-extension
    platform: iOS
    sources: [Share, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.dropmp4.app.share
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Generated/Share-Info.plist
      properties:
        CFBundleDisplayName: DropMP4
        SharedGroup: $(GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsMovieWithMaxCount: 1
    entitlements:
      path: Generated/Share.entitlements
      properties:
        com.apple.security.application-groups: [$(GROUP_ID)]
schemes:
  DropMP4Free:
    build:
      targets:
        DropMP4Free: all
    test:
      targets: [DropMP4FreeTests]
  DropMP4:
    build:
      targets:
        DropMP4: all
    test:
      targets: [DropMP4Tests]
